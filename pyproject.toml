[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edeblo-trainplat_jd065"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出大模型训练平台工程师·算子融合的收益边界上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "edeblo" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://edeblo.github.io"
Repository = "https://github.com/edeblo/trainplat_jd065"
Issues = "https://github.com/edeblo/trainplat_jd065/issues"

[project.scripts]
trainplat_jd065 = "trainplat_jd065:main"

[tool.setuptools]
py-modules = ["trainplat_jd065"]
